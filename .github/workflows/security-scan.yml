name: Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # 毎週月曜日の午前3時に実行（UTC）
    - cron: '0 3 * * 1'
  workflow_dispatch: # 手動実行を許可

jobs:
  gosec:
    name: gosec セキュリティスキャン
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gosec を実行
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif ./backend/...'

      - name: SARIF ファイルをアップロード
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  govulncheck:
    name: Go 脆弱性チェック
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: govulncheck をインストール
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck を実行
        working-directory: backend
        run: govulncheck ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint を実行
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
          args: --config=../.golangci.yml --timeout=5m

  dependency-review:
    name: 依存関係レビュー
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: 依存関係レビューを実行
        uses: actions/dependency-review-action@v4
        with:
          config-file: './.github/dependency-review-config.yml'

  summary:
    name: セキュリティスキャンサマリー
    runs-on: ubuntu-latest
    needs: [gosec, govulncheck, golangci-lint]
    if: always()

    steps:
      - name: ジョブ結果を確認
        run: |
          echo "gosec: ${{ needs.gosec.result }}"
          echo "govulncheck: ${{ needs.govulncheck.result }}"
          echo "golangci-lint: ${{ needs.golangci-lint.result }}"

          if [ "${{ needs.gosec.result }}" != "success" ] || \
             [ "${{ needs.govulncheck.result }}" != "success" ] || \
             [ "${{ needs.golangci-lint.result }}" != "success" ]; then
            echo "セキュリティスキャンが失敗しました！"
            exit 1
          fi

          echo "すべてのセキュリティチェックが成功しました！"
