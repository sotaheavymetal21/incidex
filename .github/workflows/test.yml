name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: incidex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 依存関係をダウンロード
        working-directory: backend
        run: go mod download

      - name: カバレッジ付きでテストを実行
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/incidex_test?sslmode=disable
          REDIS_URL: localhost:6379
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: カバレッジを Codecov にアップロード
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: カバレッジアーティファクトをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係をインストール
        working-directory: frontend
        run: npm ci

      - name: リンターを実行
        working-directory: frontend
        run: npm run lint

      - name: カバレッジ付きでテストを実行
        working-directory: frontend
        run: npm run test:coverage

      - name: カバレッジを Codecov にアップロード
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: カバレッジアーティファクトをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: incidex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Go をセットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: フロントエンドの依存関係をインストール
        working-directory: frontend
        run: npm ci

      - name: Playwright ブラウザをインストール
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: バックエンドをビルド
        working-directory: backend
        run: go build -o ./bin/server ./cmd/server

      - name: フロントエンドをビルド
        working-directory: frontend
        run: npm run build

      - name: バックエンドサーバーを起動
        working-directory: backend
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/incidex_test?sslmode=disable
          REDIS_URL: localhost:6379
          JWT_SECRET: test-secret-key-for-e2e-testing
          PORT: 8080
        run: |
          ./bin/server &
          sleep 5

      - name: E2E テストを実行
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e

      - name: Playwright レポートをアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: テストスクリーンショットをアップロード
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-test]
    if: always()

    steps:
      - name: ジョブ結果を確認
        run: |
          echo "バックエンドテスト: ${{ needs.backend-test.result }}"
          echo "フロントエンドテスト: ${{ needs.frontend-test.result }}"
          echo "E2E テスト: ${{ needs.e2e-test.result }}"

          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ] || \
             [ "${{ needs.e2e-test.result }}" != "success" ]; then
            echo "テストが失敗しました！"
            exit 1
          fi

          echo "すべてのテストが成功しました！"
