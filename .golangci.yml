run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Security
    - gosec        # セキュリティ問題をチェック
    - bodyclose    # HTTPレスポンスボディのクローズ漏れ
    - errcheck     # エラーハンドリングチェック
    - sqlclosecheck # SQL接続のクローズ漏れ

    # Code Quality
    - govet        # 標準の静的解析
    - staticcheck  # 高度な静的解析
    - unused       # 未使用コード検出
    - ineffassign  # 無効な代入
    - misspell     # スペルミス
    - gocyclo      # 循環的複雑度
    - dupl         # 重複コード検出

    # Bugs
    - nilerr       # nilエラーの返却チェック
    - nilnil       # nil, nil返却のチェック
    - errorlint    # エラーラップのチェック
    - errchkjson   # JSONエラーチェック

    # Performance
    - prealloc     # スライスの事前割り当て

    # Style
    - gofmt        # フォーマットチェック
    - goimports    # インポートチェック
    - revive       # 総合的なスタイルチェック

linters-settings:
  gosec:
    # セキュリティスキャンの設定
    severity: medium
    confidence: medium
    excludes:
      # 必要に応じて除外ルールを追加
    config:
      G101: # ハードコードされた認証情報の検出
        pattern: "(?i)(password|secret|token|api_key|apikey|access_key)"
      G104: # エラーチェックの強制
        audit: true
      G401: # 弱い暗号化アルゴリズム
        md5: true
        sha1: true
      G402: # TLSの最小バージョン
        min: "1.2"

  gocyclo:
    min-complexity: 15

  revive:
    rules:
      - name: exported
        disabled: false
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: var-naming
      - name: package-comments
        disabled: true
      - name: unexported-return
        disabled: true

  errcheck:
    check-type-assertions: true
    check-blank: true

  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    # テストファイルでの一部ルール除外
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - errcheck

    # マイグレーションファイルの除外
    - path: migrations/
      linters:
        - gosec

    # 生成されたコードの除外
    - path: ".*\\.pb\\.go"
      linters:
        - all

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
